<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aziza Safarova | Portfolio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&display=swap');
        :root { --primary: #ff7eb3; --accent: #8A2BE2; --bg: #0b0f1a; --glass: rgba(30, 41, 59, 0.7); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg);
            background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072');
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px; background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(20px);
            padding: 40px 20px; position: fixed; height: 100vh; border-right: 1px solid rgba(255,255,255,0.1); z-index: 1000;
        }
        .nav-link { padding: 15px; display: flex; align-items: center; gap: 12px; color: #ccc; text-decoration: none; border-radius: 12px; margin-bottom: 10px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: linear-gradient(90deg, var(--accent), var(--primary)); color: #fff; }

        /* MAIN CONTENT */
        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        .glass-panel { background: var(--glass); backdrop-filter: blur(15px); border-radius: 25px; padding: 35px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }

        /* AI SECTION */
        .ai-box { text-align: center; background: rgba(0,0,0,0.4); padding: 30px; border-radius: 20px; border: 2px solid var(--accent); }
        #webcam-container { margin: 20px auto; border-radius: 15px; overflow: hidden; max-width: 350px; border: 4px solid var(--primary); display: none; line-height: 0; }
        .ai-btn { background: #fff; color: #000; padding: 14px 40px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; font-size: 16px; }

        /* GRID FOR BOOKS & INTERESTS */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2 style="color: var(--primary); margin-bottom: 30px; text-align: center;">AZIZA</h2>
        <a href="#home" class="nav-link active"><i class="fas fa-user"></i> Profil</a>
        <a href="#ai" class="nav-link"><i class="fas fa-camera"></i> AI Detector</a>
        <a href="#books" class="nav-link"><i class="fas fa-book"></i> Mutolaa</a>
        <a href="#gallery" class="nav-link"><i class="fas fa-star"></i> Qiziqishlar</a>
    </nav>

    <div class="main-content">
        <div class="glass-panel" id="home">
            <div style="display: flex; gap: 20px; align-items: center;">
                <img src="Snapchat-720303948.jpg" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover;">
                <div>
                    <h1>Aziza Safarova</h1>
                    <p style="color: var(--primary);">Qarshi Davlat Universiteti</p>
                </div>
            </div>
        </div>

        <div class="glass-panel" id="ai">
            <h2 style="margin-bottom: 20px;"><i class="fas fa-robot"></i> AI Tizimi</h2>
            <div class="ai-box">
                <p style="margin-bottom: 20px; color: #eee;">Kamerani yoqing va model ob'ektni aniqlashini kuting.</p>
                <button class="ai-btn" onclick="startCamera()">KAMERANI YOQISH</button>
                <div id="webcam-container"></div>
                <div id="label-container" style="font-size: 24px; font-weight: bold; color: var(--primary); margin-top: 20px;">Kamera kutilmoqda...</div>
            </div>
        </div>

        <div class="glass-panel" id="books">
            <h2 style="margin-bottom: 20px;">Mutolaa</h2>
            <div class="grid">
                <div class="card">
                    <img src="https://assets.asaxiy.uz/product/main_image/desktop/2569528d2d992e59e51c8651f50a863a.jpg">
                    <p>So'nggi nido</p>
                </div>
                <div class="card">
                    <img src="https://assets.asaxiy.uz/product/main_image/desktop/c81e728d9d4c2f636f067f89cc14862c.jpg">
                    <p>Yuksak ma'naviyat</p>
                </div>
            </div>
        </div>

        <div class="glass-panel" id="gallery">
            <h2 style="margin-bottom: 20px;">Qiziqishlar</h2>
            <div class="grid">
                <div class="card"><img src="https://images.unsplash.com/photo-1555215695-3004980ad54e?w=300"><p>BMW</p></div>
                <div class="card"><img src="https://images.pexels.com/photos/56866/garden-rose-red-pink-56866.jpeg?w=300"><p>Atirgullar</p></div>
            </div>
        </div>
    </div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/QG_BoIC8L/";
        let model, webcam, labelContainer, maxPredictions;

        async function startCamera() {
            const label = document.getElementById("label-container");
            label.innerHTML = "Yuklanmoqda...";
            
            try {
                // 1. Modelni yuklash
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
                maxPredictions = model.getTotalClasses();

                // 2. Kamerani sozlash
                webcam = new tmImage.Webcam(350, 350, true);
                await webcam.setup(); 
                await webcam.play();
                
                // 3. Ekranga chiqarish
                document.getElementById("webcam-container").style.display = "block";
                document.getElementById("webcam-container").innerHTML = ""; 
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                
                labelContainer = label;
                window.requestAnimationFrame(loop);
            } catch (error) {
                console.error(error);
                label.innerHTML = "Xatolik: Kamera ruxsatini tekshiring yoki HTTPS dan foydalaning!";
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let topProb = 0;
            let topClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > topProb) {
                    topProb = prediction[i].probability;
                    topClass = prediction[i].className;
                }
            }
            labelContainer.innerHTML = topClass + " (" + (topProb * 100).toFixed(0) + "%)";
        }
    </script>
</body>
</html>

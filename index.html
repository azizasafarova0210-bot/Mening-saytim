<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aziza Safarova | AI Portfolio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&display=swap');
        :root { --primary: #ff7eb3; --accent: #8A2BE2; --glass: rgba(30, 41, 59, 0.8); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { color: #fff; background: #0f172a; display: flex; min-height: 100vh; }
        
        /* SIDEBAR */
        .sidebar { width: 260px; background: #050505; padding: 40px 20px; position: fixed; height: 100vh; border-right: 1px solid rgba(255,255,255,0.1); }
        .nav-link { padding: 15px; display: flex; align-items: center; gap: 10px; color: #aaa; text-decoration: none; border-radius: 10px; margin-bottom: 5px; }
        .nav-link.active, .nav-link:hover { background: linear-gradient(90deg, var(--accent), var(--primary)); color: #fff; }

        /* CONTENT */
        .main-content { margin-left: 260px; padding: 40px; width: 100%; }
        .glass-panel { background: var(--glass); border-radius: 20px; padding: 30px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* AI BOX */
        .ai-box { text-align: center; }
        #webcam-container { margin: 20px auto; border-radius: 15px; overflow: hidden; max-width: 400px; border: 3px solid var(--primary); display: none; }
        .ai-btn { background: #fff; color: #000; padding: 12px 30px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="margin-bottom: 30px; font-size: 18px; color: var(--primary);">AZIZA SAFAROVA</h2>
        <a href="#home" class="nav-link active"><i class="fas fa-user"></i> Profil</a>
        <a href="#ai" class="nav-link"><i class="fas fa-robot"></i> Yangi AI Model</a>
        <a href="#books" class="nav-link"><i class="fas fa-book"></i> Mutolaa</a>
    </div>

    <div class="main-content">
        <div class="glass-panel" id="home">
            <h1 style="font-size: 24px;">Aziza Safarova</h1>
            <p style="color: var(--primary); font-weight: bold;">QARSHI DAVLAT UNIVERSITETI TALABASI</p>
        </div>

        <div class="glass-panel" id="ai">
            <h2 style="margin-bottom: 20px; border-left: 4px solid var(--primary); padding-left: 10px;">Yangi AI Klassifikatsiya Tizimi</h2>
            <div class="ai-box">
                <p style="color: #ccc; margin-bottom: 15px;">Model: <strong>QG_BoIC8L</strong> asosida ishlaydi</p>
                <button class="ai-btn" onclick="init()">KAMERANI YOQISH</button>
                <div id="webcam-container"></div>
                <div id="label-container" style="margin-top: 15px; font-size: 20px; color: var(--primary); font-weight: bold;">Tayyor...</div>
            </div>
        </div>

        <div class="glass-panel" id="books">
            <h2 style="margin-bottom: 15px;">Mutolaa</h2>
            <div style="display: flex; gap: 20px;">
                <p>📖 "So'nggi nido" - Akbar Mirzo</p>
                <p>📖 "Atomic Habits" - James Clear</p>
            </div>
        </div>
    </div>

    <script>
        // FAQAT SIZNING YANGI MODELINGIZ
        const URL = "https://teachablemachine.withgoogle.com/models/QG_BoIC8L/";
        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            document.getElementById("label-container").innerHTML = "Yuklanmoqda...";
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(350, 350, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").style.display = "block";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let highProb = 0;
            let bestClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                if(prediction[i].probability > highProb) {
                    highProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }
            
            if(highProb > 0.5) {
                labelContainer.innerHTML = bestClass + " (" + (highProb * 100).toFixed(0) + "%)";
            } else {
                labelContainer.innerHTML = "🔍 Aniqlanmoqda...";
            }
        }
    </script>
</body>
</html>

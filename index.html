<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Aziza Safarova</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&display=swap');
        :root { --primary: #ff7eb3; --accent: #8A2BE2; --bg: #0b0f1a; --panel: rgba(255, 255, 255, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar { width: 260px; background: #050505; padding: 40px 20px; position: fixed; height: 100vh; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .nav-link { padding: 15px; display: flex; align-items: center; gap: 12px; color: #aaa; text-decoration: none; border-radius: 12px; margin-bottom: 8px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: linear-gradient(90deg, var(--accent), var(--primary)); color: #fff; }

        /* MAIN CONTENT */
        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        .glass-panel { background: var(--panel); backdrop-filter: blur(15px); border-radius: 24px; padding: 35px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        h2 { margin-bottom: 25px; font-size: 22px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        h2::before { content: ""; width: 4px; height: 24px; background: var(--primary); border-radius: 2px; }

        /* AI BOX */
        .ai-box { text-align: center; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 20px; }
        #webcam-container { margin: 20px auto; border-radius: 15px; overflow: hidden; max-width: 400px; border: 3px solid var(--accent); display: none; }
        .ai-btn { background: #fff; color: #000; padding: 14px 35px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .ai-btn:hover { transform: scale(1.05); background: var(--primary); color: #fff; }

        /* GRID SYSTEM (Books & Interests) */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .card-item { background: rgba(255,255,255,0.03); padding: 25px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.05); text-align: center; transition: 0.3s; }
        .card-item:hover { background: rgba(255,255,255,0.08); transform: translateY(-5px); }
        .card-item i { font-size: 32px; color: var(--primary); margin-bottom: 15px; display: block; }
        .card-item h3 { font-size: 16px; margin-bottom: 5px; }
        .card-item p { font-size: 13px; color: #aaa; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2 style="border:none; padding:0; font-size:20px; margin-bottom:40px; color:#fff;">AZIZA SAFAROVA</h2>
        <a href="#home" class="nav-link active"><i class="fas fa-user-circle"></i> Profil</a>
        <a href="#ai" class="nav-link"><i class="fas fa-microchip"></i> AI Tizimi</a>
        <a href="#books" class="nav-link"><i class="fas fa-book-reader"></i> Mutolaa</a>
        <a href="#interests" class="nav-link"><i class="fas fa-heart"></i> Qiziqishlar</a>
    </nav>

    <div class="main-content">
        <div class="glass-panel" id="home">
            <h1 style="font-size: 32px; margin-bottom: 10px;">Aziza Safarova</h1>
            <p style="color: #aaa; font-size: 18px;">Qarshi Davlat Universiteti talabasi</p>
        </div>

        <div class="glass-panel" id="ai">
            <h2>AI Klassifikatsiya Tizimi</h2>
            <div class="ai-box">
                <p style="margin-bottom: 20px; color: #ccc;">Model: <strong>QG_BoIC8L</strong> asosida ishlamoqda</p>
                <button class="ai-btn" onclick="startAI()">Kamerani Yoqish</button>
                <div id="webcam-container"></div>
                <div id="label-container" style="font-size: 24px; font-weight: 700; color: var(--primary); margin-top: 20px;">Tayyor...</div>
            </div>
        </div>

        <div class="glass-panel" id="books">
            <h2>Mutolaa</h2>
            <div class="grid-container">
                <div class="card-item">
                    <i class="fas fa-book"></i>
                    <h3>"So'nggi nido"</h3>
                    <p>Akbar Mirzo</p>
                </div>
                <div class="card-item">
                    <i class="fas fa-brain"></i>
                    <h3>"Atomic Habits"</h3>
                    <p>James Clear</p>
                </div>
            </div>
        </div>

        <div class="glass-panel" id="interests">
            <h2>Qiziqishlar</h2>
            <div class="grid-container">
                <div class="card-item">
                    <i class="fas fa-camera"></i>
                    <h3>Fotografiya</h3>
                </div>
                <div class="card-item">
                    <i class="fas fa-chess"></i>
                    <h3>Shaxmat</h3>
                </div>
                <div class="card-item">
                    <i class="fas fa-leaf"></i>
                    <h3>Atirgullar</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/QG_BoIC8L/";
        let model, webcam, labelContainer, maxPredictions;

        async function startAI() {
            const label = document.getElementById("label-container");
            label.innerHTML = "Yuklanmoqda..."; // Rasmdagi yuklanish holati boshlanishi

            try {
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
                maxPredictions = model.getTotalClasses();

                webcam = new tmImage.Webcam(350, 350, true);
                await webcam.setup();
                await webcam.play();
                
                document.getElementById("webcam-container").style.display = "block";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = label;
                window.requestAnimationFrame(loop);
            } catch (e) {
                label.innerHTML = "Xatolik: Kamera topilmadi!";
                console.error(e);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let topProb = 0;
            let topClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > topProb) {
                    topProb = prediction[i].probability;
                    topClass = prediction[i].className;
                }
            }
            
            if (topProb > 0.6) {
                labelContainer.innerHTML = topClass + " (" + (topProb * 100).toFixed(0) + "%)";
            } else {
                labelContainer.innerHTML = "Aniqlanmoqda...";
            }
        }
    </script>
</body>
</html>
